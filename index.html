        function loadTable(venues) {
            const tbody = document.querySelector('#venueTable tbody');
            tbody.innerHTML = '';
            venues.forEach(venue => {
                const row = `<tr>
                    <td>${venue.name}</td>
                    <td>${venue.distance_from_church}</td>
                    <td>${venue.location}</td>
                    <td>${venue.has_view ? "Yes" : "No"}</td>
                    <td>${venue.type_of_view}</td>
                    <td>${venue.number_people}</td>
                    <td>${venue.food_type}</td>
                    <td>${venue.phone_number}</td>
                    <td><a href="${venue.web_link}" target="_blank">Link</a></td>
                    <td>${venue.brides_comment}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterTable() {
            const filter = document.getElementById('filter').value.toLowerCase();
            const filteredVenues = data.venues.filter(venue =>
                venue.food_type.toLowerCase().includes(filter)
            );
            loadTable(filteredVenues);
        }

        function filterDistance() 
        {
            const filter = document.getElementById('distanceFilter').value;
            if (!filter) {
                loadTable(data.venues);
                return;
            }
            
            const distance = parseInt(filter, 10);
            if (isNaN(distance)) return;

            const filteredVenues = data.venues.filter(venue => {
                const venueDistance = parseInt(venue.distance_from_church, 10);
                return venueDistance <= distance;
            });

            loadTable(filteredVenues);
        }

        window.onload = () => loadTable(data.venues);
    </script>
